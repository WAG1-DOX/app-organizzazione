<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="description" content="XECUTE: calendario, lezioni, routine, spese e obiettivi in un'unica app.">
  <title>XECUTE</title>
  <link rel="icon" href="img/icona.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- iPhone: icona sulla schermata Home e nome sotto l'icona -->
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="XECUTE">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="guscio">

    <!-- ===== Barra a sinistra ===== -->
    <aside class="barra-laterale">
      <a class="logo" href="#home"><img class="logo-segno" src="img/logo.svg" alt=""> <span class="logo-nome">XECUTE</span></a>

      <!-- le voci del menu le crea app.js -->
      <nav class="menu" id="menu"></nav>

      <!-- mini calendario delle lezioni -->
      <div class="mini-calendario" id="mini-calendario"></div>

      <div class="barra-fondo">
        <button class="menu-voce" id="bottone-esci" type="button">
          <span class="icona"></span> Esci
        </button>
        <button class="menu-voce" id="bottone-reset" type="button" title="Cancella i dati salvati nel browser e torna ai dati finti">
          <span class="icona"></span> Ricomincia da capo
        </button>
      </div>
    </aside>

    <!-- ===== Parte principale ===== -->
    <div class="principale">
      <header class="barra-alta">
        <div>
          <h1 id="titolo-pagina">Ciao</h1>
          <p id="sottotitolo-pagina"></p>
        </div>
        <div class="barra-alta-destra">
          <button class="chiedi" id="bottone-assistente" type="button" aria-label="Chiedi all'assistente">
            <span class="icona-scintilla"></span> <span class="chiedi-testo">Chiedi all'assistente…</span>
          </button>
          <a class="icona-tonda" href="#promemoria" id="campanella" aria-label="Promemoria"></a>
          <div class="profilo">
            <div class="avatar" id="avatar">L</div>
            <div class="profilo-testo"><strong id="nome-profilo">…</strong><small id="email-profilo"></small><small id="stato-cloud" class="stato-cloud"></small></div>
          </div>
        </div>
      </header>

      <!-- qui app.js disegna la sezione scelta -->
      <main id="vista"></main>
    </div>
  </div>

  <!-- bottone + sempre visibile: aggiunge un'attività al calendario -->
  <button class="bottone-piu" id="bottone-piu" type="button" aria-label="Aggiungi al calendario"></button>

  <!-- finestra che si apre sopra la pagina (moduli, dettagli) -->
  <div class="modale" id="modale"></div>

  <!-- L'ordine conta: prima i dati, poi la base, poi le sezioni, infine app.js -->
  <!-- libreria ufficiale di Supabase (per login e database) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="dati-finti.js"></script>
  <script src="js/base.js"></script>
  <script src="js/sezioni/home.js"></script>
  <script src="js/sezioni/calendario.js"></script>
  <script src="js/sezioni/giornata.js"></script>
  <script src="js/sezioni/settimana.js"></script>
  <script src="js/sezioni/obiettivi.js"></script>
  <script src="js/sezioni/lezioni.js"></script>
  <script src="js/sezioni/quotidiane.js"></script>
  <script src="js/sezioni/extra.js"></script>
  <script src="js/sezioni/promemoria.js"></script>
  <script src="js/sezioni/spese.js"></script>
  <script src="js/sezioni/spesa.js"></script>
  <script src="js/sezioni/routine.js"></script>
  <script src="js/sezioni/mail.js"></script>
  <script src="js/sezioni/chat.js"></script>
  <script src="js/google.js"></script>
  <script src="js/notifiche.js"></script>
  <script src="js/accesso.js"></script>
  <script src="js/sincronizza.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
